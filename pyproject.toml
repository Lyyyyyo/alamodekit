[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alamodekit"
version = "4.0"
description = "Advanced ALAMODE Toolkit - input generation, post-processing and plotting for ALAMODE."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "刘欣", email = "liux@wtu.edu.cn" },
    { name = "刘宇佳", email = "416502968@qq.com" },
]
keywords = ["alamode", "phonon", "thermal-conductivity", "shengbte", "scph", "anharmonic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.3",
    "pandas>=1.2",
    "PyYAML>=5.4",
]

[project.scripts]
alamodekit = "alamodekit:main"

[project.urls]
Homepage = "https://github.com/Lyyyyyo/alamodekit"
Repository = "https://github.com/Lyyyyyo/alamodekit"
Issues = "https://github.com/Lyyyyyo/alamodekit/issues"

[tool.setuptools]
py-modules = [
    "alamodekit",
    "alamodekit_config",
    "alamodekit_io",
    "alamode_input",
    "plot_style",
]

# NOTE -- why `packages` is not declared here
# -------------------------------------------
# The toolkit is flat: there is no importable top-level package directory, so
# the project root itself is declared as the package. The empty package name
# "" cannot be written in `[tool.setuptools]` (setuptools rejects it during
# schema validation), which is why `packages = [""]` and
# `package_dir = {"": "."}` live in setup.py instead. Do not "tidy" them away:
# without them `package_data` below has no package to attach to and the whole
# No.X script tree is silently dropped from the wheel.
#
# NOTE -- the list below overrides setup.py
# -----------------------------------------
# When both files declare package data, this `[tool.setuptools.package-data]`
# table wins and setup.py's `package_data` is ignored. The two lists are
# therefore kept identical, so the result does not depend on which one
# setuptools honours.
[tool.setuptools.package-data]
"*" = [
    "config/settings.yaml",
    "No.*/*/*.py",
]

