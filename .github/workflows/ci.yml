name: CI

# Continuous-integration workflow for the ALAMODEkit Linux (CLI) edition.
# Runs Python syntax checks and lightweight import smoke-tests so we catch
# regressions early on every push or pull request.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pandas PyYAML pytest

      - name: Byte-compile every script (syntax check)
        run: |
          find . -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Run the shared-layer pytest suite
        run: |
          python -m pytest tests/ -v

      - name: Smoke-test the config loader
        run: |
          python -c "import alamodekit_config as c; c.load_config(); print('config OK:', c.get_settings_path())"

      - name: Smoke-test the plot-style module (Agg backend)
        run: |
          MPLBACKEND=Agg python -c "import plot_style as ps; ps.apply_plot_style(); print('plot_style OK')"

      - name: Build the menu (no interactive launch)
        run: |
          python -c "import alamodekit; print('registered functions:', len(alamodekit.SCRIPT_PATHS)); assert all(__import__('os').path.isfile(v['path']) for v in alamodekit.SCRIPT_PATHS.values())"

      # Regression guard. The wheel used to be built WITHOUT the No.X tree:
      # package_data was declared but no package was, so setuptools silently
      # dropped every subprogram and `pip install .` produced a toolkit that
      # resolved nothing. Nothing in CI noticed, because everything else runs
      # from the source tree. This step builds the real wheel and asserts the
      # payload is complete.
      - name: Guard the wheel payload
        run: |
          pip wheel . --no-deps --wheel-dir /tmp/whl
          python - <<'PY'
          import glob, os, sys, zipfile
          whl = glob.glob('/tmp/whl/*.whl')
          assert len(whl) == 1, f'expected exactly one wheel, got {whl}'
          names = zipfile.ZipFile(whl[0]).namelist()
          on_disk = {os.path.relpath(p).replace(os.sep, '/') for p in glob.glob('No.*/*/*.py')}
          got = {n for n in names if n.startswith('No.') and n.endswith('.py')}
          missing = sorted(on_disk - got)
          assert not missing, f'wheel is missing {len(missing)} subprogram(s): {missing[:5]}'
          assert 'config/settings.yaml' in names, 'wheel is missing config/settings.yaml'
          assert 'alamodekit.py' in names and 'plot_style.py' in names, 'wheel is missing a top-level module'
          print(f'wheel payload OK: {len(got)} subprograms + config/settings.yaml')
          PY

      # The step above only proves the FILES are in the wheel. This one proves
      # the installed LAYOUT runs: after `pip install .` the launcher falls back
      # to the directory holding alamodekit.py -- site-packages -- so the No.X
      # tree and config/settings.yaml must be there and resolvable, and the
      # menu must start from an unrelated working directory. That is exactly the
      # path a colleague takes on a fresh machine, and nothing else in CI
      # exercises it.
      - name: Guard the installed layout
        run: |
          pip install --no-deps --force-reinstall /tmp/whl/*.whl
          python -c "import alamodekit, os; p=os.path.dirname(alamodekit.__file__); print('installed to', p); assert os.path.isdir(os.path.join(p, 'No.1')), 'the No.X script tree was not installed'; assert os.path.isfile(os.path.join(p, 'config', 'settings.yaml')), 'config/settings.yaml was not installed'"
          mkdir -p /tmp/neutral && cd /tmp/neutral
          printf 'q\n' | python -m alamodekit > /tmp/menu.txt
          grep -q "MAIN MENU" /tmp/menu.txt
          echo "installed layout OK"

      # Regression guard for the deployment health check itself. bin_dir in the
      # repository is deliberately still the factory placeholder, so point
      # ALAMODEKIT_CONFIG at a throwaway config with stub binaries and require a
      # clean exit. This transitively asserts that the script tree is complete,
      # that all registered menu entries resolve to real files, that the config
      # loader works, that every runtime dependency imports, and that matplotlib
      # can draw on a headless machine.
      - name: Guard the deployment check
        run: |
          mkdir -p /tmp/fakebin
          for b in alm anphon analyze_phonons dfc2; do
            printf '#!/bin/sh\nexit 0\n' > "/tmp/fakebin/$b"
            chmod +x "/tmp/fakebin/$b"
          done
          printf 'alamode:\n  bin_dir: /tmp/fakebin\nplotting:\n  dpi: 300\n' > /tmp/ci_settings.yaml
          ALAMODEKIT_CONFIG=/tmp/ci_settings.yaml MPLBACKEND=Agg python check_deploy.py

      # Regression guard. The menu launches a subprogram as
      # `python <root>/No.X/<submenu>/<script>.py`, so sys.path[0] is the
      # script's own folder -- NOT the toolkit root. A subprogram that imports
      # alamodekit_io without first putting the root on sys.path dies with
      # ModuleNotFoundError as soon as a user picks it from the menu.
      # 21 of 44 shipped that way because CI only ever exercised the source tree
      # (and only the No.6/No.7 subprograms, which happened to be correct).
      - name: Guard the subprogram bootstrap
        run: |
          python - <<'PY'
          import glob
          import re

          bad = []
          for path in sorted(glob.glob('No.*/*/*.py')):
              lines = open(path, encoding='utf-8').read().splitlines()
              imp = next((i for i, l in enumerate(lines)
                          if re.match(r'\s*import\s+alamodekit_io\b', l)), None)
              if imp is None:
                  continue  # this subprogram does not use the toolkit modules
              ins = next((i for i, l in enumerate(lines)
                          if 'sys.path.insert' in l), None)
              if ins is None or ins > imp:
                  bad.append(path)

          assert not bad, (
              'subprogram(s) import alamodekit_io before putting the toolkit '
              f'root on sys.path: {bad}')
          print('bootstrap OK: every toolkit-importing subprogram bootstraps sys.path')
          PY

      - name: Smoke-test the pure-Python helpers (No.6)
        run: |
          # input_validator: build a tiny namelist file and check it parses.
          printf '&general\n  PREFIX = Si\n/\n' > /tmp/t.in
          MPLBACKEND=Agg python No.6/604/input_validator.py /tmp/t.in || true
          # conv_test_helper: generate a 1x1 sweep from a template.
          printf '&general\n  PREFIX = T\n  KPMESH = @K@\n/\n' > /tmp/tmpl.in
          python No.6/604/conv_test_helper.py --template /tmp/tmpl.in --param "@K@:4,8" --exe anphon >/dev/null
          test -f /tmp/tmpl__K_4.in && test -f run_all.sh && echo "No.6 helpers OK"

      - name: Smoke-test the external interfaces (No.7)
        run: |
          # thermo_from_dos: build a tiny DOS and check it integrates.
          MPLBACKEND=Agg python - <<'PY'
          import numpy as np
          f=np.arange(0,501,5.0); dos=np.exp(-((f-200)/30)**2)*6/np.trapz(np.exp(-((f-200)/30)**2),f)
          with open('/tmp/t.dos','w') as fh:
              fh.write('#\n# dos\n# f d\n')
              for a,b in zip(f,dos): fh.write(f'{a:6.1f} {b:10.6f}\n')
          PY
          MPLBACKEND=Agg python No.7/701/thermo_from_dos.py /tmp/t.dos --tmax 100 --tstep 100 >/dev/null && echo "thermo OK"
          # structure_to_vesta: export a POSCAR to all formats.
          printf 'test\n1.0\n4 0 0\n0 4 0\n0 0 4\nSi\n1\nDirect\n0 0 0\n' > /tmp/POSCAR
          python No.7/703/structure_to_vesta.py /tmp/POSCAR --format all
          test -f /tmp/POSCAR.xsf && test -f /tmp/POSCAR.cif && echo "structure export OK"

      - name: Smoke-test the vibration visualiser (No.7/706)
        run: |
          # Build a tiny 1-kpoint Si .evec and turn it into an .axsf.
          cat > /tmp/POSCAR2 <<'EOF'
Si
1.0
5.43 0 0
0 5.43 0
0 0 5.43
Si
2
Direct
0 0 0
0.25 0.25 0.25
EOF
          python - <<'PY'
          lat = ['# Lattice vectors of the primitive cell',
                 '  5.43 0 0', '  0 5.43 0', '  0 0 5.43', '',
                 '# Reciprocal lattice vectors of the primitive cell',
                 '  1.157 0 0', '  0 1.157 0', '  0 0 1.157', '',
                 '# Number of phonon modes: 6',
                 '# Number of k points : 1',
                 '# Number of atomic kinds : 1',
                 '# Atomic masses : 28.0855', '',
                 '# Eigenvalues and eigenvectors for each phonon modes below:', '',
                 '## kpoint       1 :   0.000000   0.000000   0.000000']
          import math
          r = math.sqrt(0.5)
          for m in range(1,7):
              w = '0.000000' if m<=3 else '0.988000'
              lat.append(f'### mode       {m} :   {w}')
              for k in range(6):
                  v = r if k%3 == (m-1)%3 else 0.0
                  sign = '-' if (m>3 and k>=3) else ''
                  lat.append(f'  {sign}{v:.7e}   0.0000000e+00')
              lat.append('')
          open('/tmp/Si.evec','w').write('\n'.join(lat)+'\n')
          PY
          python No.7/706/vib_vesta.py /tmp/POSCAR2 /tmp/Si.evec -k 1 --modes 4 --frames 4 >/dev/null
          test -f /tmp/Si_k1_mode4.axsf && echo "vib_vesta OK"
